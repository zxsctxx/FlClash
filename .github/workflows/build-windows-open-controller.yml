name: build-windows-open-controller

on:
  workflow_dispatch:
  push:
    branches:
      - open-controller-0.0.0.0
    paths:
      - 'lib/**'
      - 'core/**'
      - 'windows/**'
      - 'plugins/**'
      - 'setup.dart'
      - 'pubspec.yaml'
      - '.github/workflows/build-windows-open-controller.yml'

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable git long paths (Windows)
        run: git config --global core.longpaths true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Verify open controller patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/enum/enum.dart
            lib/common/constant.dart
            lib/models/generated/core.g.dart
            lib/models/generated/clash_config.g.dart
          )
          grep -n "0\.0\.0\.0:9090" "${files[@]}"
          if grep -n "127\.0\.0\.1:9090" "${files[@]}"; then
            echo 'still has loopback hardcode' >&2
            exit 1
          fi

      - name: Build Windows
        run: dart setup.dart windows -v

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-windows-amd64-open9090
          path: ./dist
          if-no-files-found: error
          retention-days: 14
